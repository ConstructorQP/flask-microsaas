<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>constructor | microsaas — Acceso</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-page">

  <!-- Lado izquierdo: branding -->
  <div class="login-left">
    <div class="login-left-brand">
      <div class="login-left-mark">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="7" height="7" rx="1.5"/>
          <rect x="11" y="2" width="7" height="7" rx="1.5"/>
          <rect x="2" y="11" width="7" height="7" rx="1.5"/>
          <rect x="11" y="11" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <span class="login-left-name">constructor <span>|</span> microsaas</span>
    </div>

    <div class="login-left-tagline">
      <h1>Gestiona tu negocio sin <em>complicaciones</em></h1>
      <p>Clientes, productos y pedidos en un solo lugar. Diseñado para ir directo al grano.</p>
    </div>

    <div class="login-left-footer">constructor | microsaas &copy; 2024</div>
  </div>

  <!-- Lado derecho: formulario -->
  <div class="login-right">
    <div class="login-form-wrap">

      <div class="login-logo-row">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="logo">
      </div>

      <div class="login-form-title">Bienvenido de nuevo</div>
      <div class="login-form-sub">Accede con tus credenciales para continuar</div>

      {% if error %}
      <div class="alert-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('login') }}">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" class="form-control"
                 placeholder="Tu nombre de usuario" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="Tu contraseña" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-login">Entrar</button>
      </form>

    </div>
  </div>

</div>
</body>
</html>
